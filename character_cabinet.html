<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Cabinet</title>
<style>
:root{
  --bg:#f5f3ed;--panel:#fffefa;--text:#292c27;--muted:#777b70;--line:#e5e2d8;
  --accent:#78866b;--accent-soft:#e9ede4;--danger:#a34f4f;--shadow:0 8px 28px rgba(42,44,36,.06);
  --serif:Georgia,serif;--sans:Arial, sans-serif;--radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:28px}
.brand{padding:4px 10px}
.brand h1{font: bold 27px var(--serif);margin:0 0 5px;letter-spacing:-.7px}
.brand p{color:var(--muted);font-size:12px;margin:0;letter-spacing:1.2px;text-transform:uppercase}
.nav{display:grid;gap:7px}
.nav button{border:0;background:transparent;color:var(--muted);padding:12px 13px;text-align:left;border-radius:12px;display:flex;gap:12px;align-items:center}
.nav button.active,.nav button:hover{background:var(--accent-soft);color:var(--text)}
.nav .ico{width:20px;text-align:center}
.sidebar-bottom{margin-top:auto;display:grid;gap:8px}
.small-note{font-size:12px;color:var(--muted);line-height:1.5;padding:10px}
main{padding:38px clamp(20px,5vw,64px);max-width:1500px;width:100%;margin:0 auto}
.topline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;color:var(--muted);margin-bottom:8px}
h2{font:normal clamp(30px,4vw,42px) var(--serif);margin:0;letter-spacing:-1px}
.subtitle{color:var(--muted);margin:9px 0 0;line-height:1.5}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 15px;border-radius:999px;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn:hover{filter:brightness(.97)}
.searchrow{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}
.searchrow input{flex:1;min-width:190px}
input,textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:95px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.character-card{cursor:pointer;transition:transform .15s,border-color .15s}
.character-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.avatar{width:58px;height:58px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;font:24px var(--serif);color:var(--accent);overflow:hidden;margin-bottom:16px}
.avatar img{width:100%;height:100%;object-fit:cover}
.card h3{font:normal 22px var(--serif);margin:0 0 5px;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:5px 9px;border-radius:999px;font-size:11px;margin:12px 5px 0 0}
.empty{padding:55px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
.empty strong{display:block;color:var(--text);font:24px var(--serif);margin-bottom:8px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 15px}
.section-head h3{font:normal 23px var(--serif);margin:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);letter-spacing:.3px}
.modal-backdrop{position:fixed;inset:0;background:rgba(25,27,23,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal-backdrop.show{display:flex}
.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:20px;padding:25px;box-shadow:0 20px 70px rgba(0,0,0,.2)}
.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-top h3{font:normal 27px var(--serif);margin:0}
.close{border:0;background:transparent;font-size:25px;color:var(--muted)}
.form-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.detail-layout{display:grid;grid-template-columns:180px 1fr;gap:22px}
.detail-avatar{width:100%;aspect-ratio:1;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center;font:52px var(--serif);color:var(--accent);overflow:hidden}
.detail-avatar img{width:100%;height:100%;object-fit:cover}
.detail-block{margin-top:20px}
.detail-block h4{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 7px}
.detail-block p{white-space:pre-wrap;line-height:1.6;margin:0}
.relationships{display:flex;flex-wrap:wrap;gap:9px}
.relationship{border:1px solid var(--line);padding:9px 12px;border-radius:12px;background:var(--bg);font-size:13px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.color-options{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid white;outline:1px solid var(--line)}
.swatch.selected{outline:2px solid var(--text)}
footer{margin-top:45px;color:var(--muted);font-size:12px;text-align:center}
.hidden{display:none!important}
.hero{background:var(--accent-soft);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,38px);margin-bottom:22px}
.hero h3{font:normal clamp(27px,4vw,38px) var(--serif);margin:0 0 9px}
.hero p{max-width:620px;line-height:1.6;color:var(--muted);margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 28px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}
.stat strong{display:block;font:28px var(--serif);margin-bottom:4px}
.stat span{font-size:12px;color:var(--muted)}
.map-wrap{position:relative;min-height:360px;border:1px solid var(--line);border-radius:17px;background:var(--bg);overflow:hidden}
.map-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.map-node{position:absolute;transform:translate(-50%,-50%);width:100px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 7px;box-shadow:var(--shadow);cursor:pointer;font-size:12px;z-index:2}
.map-node.main{border:2px solid var(--accent);background:var(--accent-soft)}
.map-node .dot{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font:16px var(--serif)}
.map-node.main .dot{background:var(--accent);color:white}
.map-line{stroke:var(--accent);stroke-width:2;opacity:.65}
.map-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.public-note{padding:12px 14px;background:var(--accent-soft);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:760px){
 .stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .map-wrap{min-height:420px}
 .map-node{width:88px;font-size:11px}

 .app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:15px;gap:12px}
 .brand{padding:0 5px}.brand h1{font-size:23px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}
 .sidebar-bottom{display:none}main{padding:26px 17px}.topline{align-items:flex-start;flex-direction:column}
 .detail-layout{grid-template-columns:1fr}.detail-avatar{width:120px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><h1>Character Cabinet</h1><p>Your personal story archive</p></div>
  <nav class="nav" aria-label="Main navigation">
    <button class="active" data-page="home"><span class="ico">⌂</span> Home</button>
    <button data-page="characters"><span class="ico">✧</span> Characters</button>
    <button data-page="universes"><span class="ico">◈</span> Universes</button>
    <button data-page="stories"><span class="ico">▤</span> Stories & plots</button>
    <button data-page="settings"><span class="ico">⚙</span> Appearance</button>
  </nav>
  <div class="sidebar-bottom">
    <button class="btn" id="exportBtn">↥ Export my archive</button>
    <button class="btn" id="importBtn">↧ Import archive</button>
    <div class="small-note">Your archive is saved in this browser on this device. Export a backup from time to time.</div>
  </div>
</aside>
<main>
  <div class="topline">
    <div><div class="eyebrow" id="eyebrow">The archive</div><h2 id="pageTitle">Characters</h2><p class="subtitle" id="pageSubtitle">Keep every character, connection and detail in one place.</p></div>
    <div class="actions" id="pageActions"><button class="btn primary" id="addBtn">＋ New character</button></div>
  </div>
  <div id="pageContent"></div>
  <footer>Character Cabinet · A little home for the worlds you create</footer>
</main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-top"><h3 id="modalTitle">New character</h3><button class="close" id="closeModal" aria-label="Close">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<input type="file" id="importFile" accept="application/json" class="hidden">

<script>
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()));
const blankData = {characters:[],universes:[],stories:[],settings:{accent:'#78866b',theme:'light',font:'Georgia'}};
let data;
try { data = JSON.parse(localStorage.getItem('characterCabinetData')) || structuredClone(blankData); }
catch(e){ data = structuredClone(blankData); }
data.characters ||= []; data.universes ||= []; data.stories ||= []; data.settings ||= {...blankData.settings};
let page='home', activeCharacter=null, editingId=null;
const accents=['#78866b','#9b7775','#82779b','#718ba0','#b17c55','#777777','#a18b60'];
function save(){localStorage.setItem('characterCabinetData',JSON.stringify(data));}
function applySettings(){
 const s=data.settings;
 document.documentElement.style.setProperty('--accent',s.accent||'#78866b');
 document.documentElement.style.setProperty('--accent-soft',hexToRgba(s.accent||'#78866b',.13));
 document.documentElement.style.setProperty('--serif',s.font||'Georgia');
 document.body.style.background=s.theme==='dark'?'#20231f':'var(--bg)';
 document.body.style.color=s.theme==='dark'?'#f0efe8':'var(--text)';
 if(s.theme==='dark'){
  document.documentElement.style.setProperty('--panel','#2b2f29');document.documentElement.style.setProperty('--bg','#20231f');
  document.documentElement.style.setProperty('--text','#f0efe8');document.documentElement.style.setProperty('--muted','#b5b8ad');document.documentElement.style.setProperty('--line','#41463d');
 }else{
  document.documentElement.style.setProperty('--panel','#fffefa');document.documentElement.style.setProperty('--bg','#f5f3ed');
  document.documentElement.style.setProperty('--text','#292c27');document.documentElement.style.setProperty('--muted','#777b70');document.documentElement.style.setProperty('--line','#e5e2d8');
 }
}
function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(name='?'){return esc(name.trim().charAt(0).toUpperCase()||'?');}
function setPage(p){
 page=p;activeCharacter=null;
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 const config={
 home:['Welcome back','Your cabinet','A quiet little space for all your characters, universes and stories.','＋ New character'],
 characters:['The archive','Characters','Keep every character, connection and detail in one place.','＋ New character'],
 universes:['Worldbuilding','Universes','Collect the worlds, settings and places behind your stories.','＋ New universe'],
 stories:['The plot library','Stories & plots','Keep track of stories, arcs, chapters and ideas.','＋ New story'],
 settings:['Make it yours','Appearance','Adjust the look and feel of your cabinet.','']
 }[p];
 $('#eyebrow').textContent=config[0];$('#pageTitle').textContent=config[1];$('#pageSubtitle').textContent=config[2];
 $('#pageActions').innerHTML=config[3]?`<button class="btn primary" id="addBtn">${config[3]}</button>`:'';
 if(config[3])$('#addBtn').onclick=()=>openForm(p.slice(0,-1));
 render();
}
function render(){
 const root=$('#pageContent');
 if(page==='characters')renderCharacters(root);
 if(page==='universes')renderCollection(root,'universes','universe');
 if(page==='stories')renderCollection(root,'stories','story');
 if(page==='settings')renderSettings(root);
}
function renderHome(root){
 const recent=[...data.characters].slice(-4).reverse();
 root.innerHTML=`
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:24px">
  <div class="card"><div class="eyebrow">Characters</div><h2>${data.characters.length}</h2><p class="muted">In your archive</p></div>
  <div class="card"><div class="eyebrow">Universes</div><h2>${data.universes.length}</h2><p class="muted">Worlds created</p></div>
  <div class="card"><div class="eyebrow">Stories</div><h2>${data.stories.length}</h2><p class="muted">Stories & plots</p></div>
 </div>
 <section class="card" style="margin-bottom:22px;background:var(--accent-soft);box-shadow:none">
  <div class="eyebrow">A home for your imagination</div>
  <h2 style="font-size:30px">Every story starts somewhere.</h2>
  <p class="subtitle">Build character profiles, connect their relationships, and keep every fictional universe organised.</p>
  <div class="actions" style="margin-top:17px">
   <button class="btn primary" id="homeAddCharacter">＋ Add a character</button>
   <button class="btn" id="homeAddUniverse">＋ Create a universe</button>
   <button class="btn" id="homeAddStory">＋ Start a story</button>
  </div>
 </section>
 <div class="section-head"><h3>Recently added characters</h3><button class="btn" id="viewAllCharacters">View all</button></div>
 ${recent.length?`<div class="grid">${recent.map(c=>`<article class="card character-card" data-id="${c.id}"><div class="avatar">${c.image?`<img src="${esc(c.image)}" alt="">`:initials(c.name)}</div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.nickname||c.role||'Character')}</div></article>`).join('')}</div>`:`<div class="empty"><strong>Your first character goes here</strong>Create a profile and start filling your cabinet with life.</div>`}
 <div class="section-head"><h3>A little reminder</h3></div>
 <p class="muted">Your archive is private and stored in this browser. If you want to share a character, you can create a separate public-page file from that character's profile. Only share details you're comfortable making public.</p>`;
 $('#homeAddCharacter').onclick=()=>openForm('character');
 $('#homeAddUniverse').onclick=()=>openForm('universe');
 $('#homeAddStory').onclick=()=>openForm('story');
 $('#viewAllCharacters').onclick=()=>setPage('characters');
 document.querySelectorAll('.character-card').forEach(card=>card.onclick=()=>showCharacter(card.dataset.id));
}
function renderHome(root){
 const recent=[...data.characters].slice(-4).reverse();
 root.innerHTML=`<section class="hero"><div class="eyebrow">A personal archive for fictional worlds</div><h3>Every character has a story.<br>Give yours a place to live.</h3><p>Collect character profiles, map their connections, and keep your universes and plots organised — all in one cabinet.</p><div class="actions" style="margin-top:19px"><button class="btn primary" id="homeNewCharacter">＋ Create a character</button><button class="btn" id="homeNewUniverse">＋ New universe</button></div></section>
 <div class="stat-grid"><div class="stat"><strong>${data.characters.length}</strong><span>Characters</span></div><div class="stat"><strong>${data.universes.length}</strong><span>Universes</span></div><div class="stat"><strong>${data.stories.length}</strong><span>Stories & plots</span></div></div>
 <div class="section-head"><h3>Recently added characters</h3><button class="btn" id="allCharacters">View all</button></div>
 ${recent.length?`<div class="grid">${recent.map(c=>`<article class="card character-card" data-id="${c.id}"><div class="avatar">${c.image?`<img src="${esc(c.image)}" alt="">`:initials(c.name)}</div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.nickname||c.role||'Character')}</div></article>`).join('')}</div>`:`<div class="empty"><strong>Your first character starts here</strong>Create a profile, then connect them to the rest of your cast.</div>`}
 <div class="section-head"><h3>Quick access</h3></div><div class="actions"><button class="btn" id="homeCharacters">✧ Characters</button><button class="btn" id="homeUniverses">◈ Universes</button><button class="btn" id="homeStories">▤ Stories & plots</button><button class="btn" id="homeSettings">⚙ Appearance</button></div>`;
 $('#homeNewCharacter').onclick=()=>openForm('character');$('#homeNewUniverse').onclick=()=>openForm('universe');
 $('#allCharacters').onclick=$('#homeCharacters').onclick=()=>setPage('characters');
 $('#homeUniverses').onclick=()=>setPage('universes');$('#homeStories').onclick=()=>setPage('stories');$('#homeSettings').onclick=()=>setPage('settings');
 document.querySelectorAll('.character-card').forEach(card=>card.onclick=()=>showCharacter(card.dataset.id));
}
function renderCharacters(root){
 root.innerHTML=`<div class="searchrow"><input id="search" placeholder="Search characters, roles or details…" aria-label="Search characters"><select id="sort"><option value="new">Recently added</option><option value="az">Name A–Z</option></select></div><div id="characterGrid"></div>`;
 const draw=()=>{
  const q=$('#search').value.toLowerCase(),sort=$('#sort').value;
  let items=data.characters.filter(c=>[c.name,c.role,c.personality,c.universe].join(' ').toLowerCase().includes(q));
  if(sort==='az')items.sort((a,b)=>a.name.localeCompare(b.name));else items.reverse();
  $('#characterGrid').innerHTML=items.length?`<div class="grid">${items.map(c=>`<article class="card character-card" data-id="${c.id}"><div class="avatar">${c.image?`<img src="${esc(c.image)}" alt="">`:initials(c.name)}</div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.nickname||c.role||'Character')}</div>${c.universe?`<span class="tag">${esc(c.universe)}</span>`:''}</article>`).join('')}</div>`:`<div class="empty"><strong>${q?'No matching characters':'Your cabinet is waiting'}</strong>${q?'Try another search.':'Add your first character to start building your archive.'}<br><br>${q?'':`<button class="btn primary" onclick="openForm('character')">＋ Create a character</button>`}</div>`;
  document.querySelectorAll('.character-card').forEach(card=>card.onclick=()=>showCharacter(card.dataset.id));
 };
 $('#search').oninput=draw;$('#sort').onchange=draw;draw();
}
function renderCollection(root,key,type){
 const items=data[key];
 root.innerHTML=items.length?`<div class="grid">${items.map(x=>`<article class="card"><h3>${esc(x.name)}</h3><p class="muted">${esc(x.genre||'')}</p><p>${esc((x.description||x.synopsis||'').slice(0,150))}${(x.description||x.synopsis||'').length>150?'…':''}</p><div class="actions"><button class="btn" onclick="editItem('${key}','${x.id}')">Edit</button><button class="btn" onclick="deleteItem('${key}','${x.id}')">Delete</button></div></article>`).join('')}</div>`:`<div class="empty"><strong>No ${type==='story'?'stories':'universes'} yet</strong>Add one to start organising your worldbuilding.<br><br><button class="btn primary" onclick="openForm('${type}')">＋ New ${type}</button></div>`;
}
function renderSettings(root){
 root.innerHTML=`<div class="settings-grid">
 <section class="card"><h3>Accent colour</h3><p class="muted">Choose the colour used for buttons and highlights.</p><div class="color-options">${accents.map(c=>`<button class="swatch ${data.settings.accent===c?'selected':''}" style="background:${c}" data-color="${c}" aria-label="Choose accent ${c}"></button>`).join('')}</div><div class="field" style="margin-top:15px"><label>Custom colour</label><input type="color" id="customAccent" value="${data.settings.accent||'#78866b'}"></div></section>
 <section class="card"><h3>Theme</h3><p class="muted">Choose a light or dark cabinet.</p><select id="theme"><option value="light" ${data.settings.theme!=='dark'?'selected':''}>Light</option><option value="dark" ${data.settings.theme==='dark'?'selected':''}>Dark</option></select></section>
 <section class="card"><h3>Heading font</h3><p class="muted">Change the character-card and page-heading style.</p><select id="font"><option value="Georgia">Georgia — classic</option><option value="'Palatino Linotype'">Palatino — editorial</option><option value="Garamond">Garamond — literary</option><option value="Arial">Arial — simple</option></select></section>
 <section class="card"><h3>Your data</h3><p class="muted">Your archive is stored in this browser. Export a JSON backup before clearing browser data or changing devices.</p><button class="btn" id="settingsExport">Export backup</button></section>
 </div>`;
 $('#font').value=data.settings.font||'Georgia';
 document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{data.settings.accent=b.dataset.color;save();applySettings();renderSettings(root);});
 $('#customAccent').onchange=e=>{data.settings.accent=e.target.value;save();applySettings();renderSettings(root);};
 $('#theme').onchange=e=>{data.settings.theme=e.target.value;save();applySettings();};
 $('#font').onchange=e=>{data.settings.font=e.target.value;save();applySettings();};
 $('#settingsExport').onclick=exportData;
}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalBackdrop').classList.add('show');}
function closeModal(){$('#modalBackdrop').classList.remove('show');}
function openForm(type,item={}){
 editingId=item.id||null;
 if(type==='character'){
  openModal(editingId?'Edit character':'New character',`
  <form id="entryForm"><div class="form-grid">
   ${field('Name','name',item.name,'required')}${field('Nickname','nickname',item.nickname)}
   ${field('Age','age',item.age)}${field('Role in story','role',item.role)}
   ${field('Universe','universe',item.universe)}${field('Image URL (optional)','image',item.image,'type="url"')}
   ${area('Appearance','appearance',item.appearance)}${area('Personality','personality',item.personality)}
   ${area('Backstory','backstory',item.backstory)}${area('Motivations & fears','motivations',item.motivations)}
   ${area('Likes, dislikes & habits','habits',item.habits)}${area('Notes & quotes','notes',item.notes)}
   <div class="field full"><label>Relationships (one per line: Character name — relationship)</label><textarea name="relationships" placeholder="Mira — best friend&#10;Rowan — rival">${esc((item.relationships||[]).join('\n'))}</textarea></div>
  </div><div class="form-actions"><button type="button" class="btn" id="cancelForm">Cancel</button><button class="btn primary" type="submit">Save character</button></div></form>`);
 }else{
  const isStory=type==='story',key=isStory?'stories':'universes';
  openModal(editingId?'Edit entry':`New ${type}`,`<form id="entryForm"><div class="form-grid">
   ${field('Name','name',item.name,'required')}${field('Genre','genre',item.genre)}
   ${area(isStory?'Synopsis':'Description',isStory?'synopsis':'description',item[isStory?'synopsis':'description'])}
   ${area(isStory?'Main plot & subplots':'Setting & worldbuilding',isStory?'plot':'worldbuilding',item[isStory?'plot':'worldbuilding'])}
   ${area(isStory?'Chapters, episodes & events':'Locations & important events',isStory?'chapters':'locations',item[isStory?'chapters':'locations'])}
   ${field('Associated characters (names)','characters',item.characters)}
  </div><div class="form-actions"><button type="button" class="btn" id="cancelForm">Cancel</button><button class="btn primary" type="submit">Save ${type}</button></div></form>`);
 }
 $('#cancelForm').onclick=closeModal;
 $('#entryForm').onsubmit=e=>{
  e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());
  if(type==='character'){
   obj.relationships=(obj.relationships||'').split('\n').map(s=>s.trim()).filter(Boolean);
   const saved={...item,...obj,id:editingId||uid()};
   if(editingId)data.characters=data.characters.map(c=>c.id===editingId?saved:c);else data.characters.push(saved);
  }else{
   const saved={...item,...obj,id:editingId||uid()};
   const key=type==='story'?'stories':'universes';
   if(editingId)data[key]=data[key].map(x=>x.id===editingId?saved:x);else data[key].push(saved);
  }
  save();closeModal();render();
 };
}
function field(label,name,value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" value="${esc(value||'')}" ${extra}></div>`;}
function area(label,name,value=''){return `<div class="field full"><label>${label}</label><textarea name="${name}">${esc(value||'')}</textarea></div>`;}
function showCharacter(id){
 const c=data.characters.find(x=>x.id===id);if(!c)return;activeCharacter=id;
 const sections=[['Appearance',c.appearance],['Personality',c.personality],['Backstory',c.backstory],['Motivations & fears',c.motivations],['Likes, dislikes & habits',c.habits],['Notes & quotes',c.notes]];
 openModal(c.name,`<div class="detail-layout"><div><div class="detail-avatar">${c.image?`<img src="${esc(c.image)}" alt="">`:initials(c.name)}</div><p class="muted">${esc(c.nickname||'')}${c.age?' · '+esc(c.age):''}</p>${c.role?`<span class="tag">${esc(c.role)}</span>`:''}</div><div><p class="muted">${esc(c.universe||'No universe assigned')}</p>${sections.filter(s=>s[1]).map(s=>`<div class="detail-block"><h4>${s[0]}</h4><p>${esc(s[1])}</p></div>`).join('')}</div></div>
 <div class="detail-block"><h4>Relationships</h4><div class="relationships">${(c.relationships||[]).length?c.relationships.map(r=>`<span class="relationship">${esc(r)}</span>`).join(''):'<span class="muted">No relationships added yet.</span>'}</div></div>
 <div class="form-actions"><button class="btn" id="deleteCharacter">Delete</button><div class="actions"><button class="btn" id="shareCharacter">Create public page</button><button class="btn" id="editCharacter">Edit profile</button><button class="btn primary" id="doneCharacter">Done</button></div></div>`);
 $('#doneCharacter').onclick=closeModal;
 $('#shareCharacter').onclick=()=>createPublicPage(c);
 $('#editCharacter').onclick=()=>{closeModal();openForm('character',c);};
 $('#deleteCharacter').onclick=()=>{if(confirm(`Delete ${c.name}?`)){data.characters=data.characters.filter(x=>x.id!==id);save();closeModal();render();}};
}
function showRelationshipMap(id){
 const c=data.characters.find(x=>x.id===id);if(!c)return;
 const links=(c.relationships||[]).filter(r=>r&&typeof r==='object'&&r.targetId).map(r=>({...r,target:data.characters.find(t=>t.id===r.targetId)})).filter(r=>r.target);
 const legacy=(c.relationships||[]).filter(r=>typeof r==='string');
 const count=links.length, positions=[];
 const center={x:50,y:50};
 links.forEach((r,i)=>{const angle=(-Math.PI/2)+(2*Math.PI*i/Math.max(count,1));positions.push({x:50+34*Math.cos(angle),y:50+34*Math.sin(angle),r});});
 let nodes=`<button class="map-node main" style="left:50%;top:50%" onclick="showCharacter('${c.id}')"><span class="dot">${initials(c.name)}</span>${esc(c.name)}</button>`;
 let lines='';
 positions.forEach(pos=>{lines+=`<line class="map-line" x1="50%" y1="50%" x2="${pos.x}%" y2="${pos.y}%"/>`;nodes+=`<button class="map-node" style="left:${pos.x}%;top:${pos.y}%" onclick="showCharacter('${pos.r.target.id}')"><span class="dot">${initials(pos.r.target.name)}</span>${esc(pos.r.target.name)}<br><span class="muted">${esc(pos.r.label||'connected')}</span></button>`;});
 openModal(`${esc(c.name)} · Relationship map`,`
 <p class="muted">Select a character node to open their profile. Connections below describe how <b>${esc(c.name)}</b> sees the other character.</p>
 <div class="map-wrap"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>${nodes}</div>
 <div class="section-head"><h3>Connections</h3><button class="btn primary" id="addRelationship">＋ Add connection</button></div>
 ${links.length?`<div class="relationships">${links.map(r=>`<span class="relationship">${esc(c.name)} → ${esc(r.target.name)}: ${esc(r.label||'connected')} <button aria-label="Remove connection" onclick="removeRelationship('${c.id}','${r.target.id}')" style="border:0;background:none;color:var(--danger)">×</button></span>`).join('')}</div>`:'<p class="muted">No connections yet. Add another character to start the map.</p>'}
 ${legacy.length?`<p class="muted" style="margin-top:12px">Older notes: ${legacy.map(esc).join(' · ')}</p>`:''}
 <div class="form-actions"><button class="btn" id="mapBack">Back to profile</button></div>`);
 $('#addRelationship').onclick=()=>addRelationship(c.id);
 $('#mapBack').onclick=()=>showCharacter(c.id);
}
window.removeRelationship=(sourceId,targetId)=>{
 const c=data.characters.find(x=>x.id===sourceId);if(!c)return;
 c.relationships=(c.relationships||[]).filter(r=>!(r&&typeof r==='object'&&r.targetId===targetId));save();showRelationshipMap(sourceId);
};
function addRelationship(sourceId){
 const c=data.characters.find(x=>x.id===sourceId);if(!c)return;
 const candidates=data.characters.filter(x=>x.id!==sourceId);
 if(!candidates.length){alert('Create at least one other character before adding a connection.');return;}
 openModal('Add a relationship',`<form id="relationshipForm"><div class="form-grid">
 <div class="field full"><label>Character</label><select name="targetId" required>${candidates.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
 <div class="field"><label>How ${esc(c.name)} sees them</label><select name="label"><option>Best friend</option><option>Close friend</option><option>Friend</option><option>Family</option><option>Lover</option><option>Crush</option><option>Respect</option><option>Trusted</option><option>Rival</option><option>Dislike</option><option>Enemy</option><option>Hate</option><option>Neutral</option><option>Unknown</option></select></div>
 <div class="field"><label>Direction</label><select name="direction"><option value="one-way">One-way (this character's view)</option><option value="mutual">Mutual (same label both ways)</option></select></div>
 </div><div class="form-actions"><button type="button" class="btn" id="cancelRelationship">Cancel</button><button class="btn primary">Add connection</button></div></form>`);
 $('#cancelRelationship').onclick=()=>showRelationshipMap(sourceId);
 $('#relationshipForm').onsubmit=e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries());
  const target=data.characters.find(x=>x.id===f.targetId);if(!target)return;
  c.relationships=(c.relationships||[]).filter(r=>!(r&&typeof r==='object'&&r.targetId===target.id));
  c.relationships.push({targetId:target.id,label:f.label});
  if(f.direction==='mutual'){
   target.relationships=(target.relationships||[]).filter(r=>!(r&&typeof r==='object'&&r.targetId===c.id));
   target.relationships.push({targetId:c.id,label:f.label});
  }
  save();showRelationshipMap(sourceId);
 };
}
function showPublicPageOptions(id){
 const c=data.characters.find(x=>x.id===id);if(!c)return;
 openModal('Create a public character page',`
 <p class="muted">Choose what to include. Your private archive stays private. This creates a standalone HTML page you can upload to a website host or share as a file.</p>
 <form id="publicForm"><div class="form-grid">
 <div class="field full"><label><input type="checkbox" name="appearance" checked style="width:auto"> Include appearance</label></div>
 <div class="field full"><label><input type="checkbox" name="personality" checked style="width:auto"> Include personality</label></div>
 <div class="field full"><label><input type="checkbox" name="backstory" style="width:auto"> Include backstory</label></div>
 <div class="field full"><label><input type="checkbox" name="motivations" checked style="width:auto"> Include motivations & fears</label></div>
 <div class="field full"><label><input type="checkbox" name="habits" checked style="width:auto"> Include likes, dislikes & habits</label></div>
 <div class="field full"><label><input type="checkbox" name="notes" style="width:auto"> Include notes & quotes</label></div>
 <div class="field full"><label><input type="checkbox" name="relationships" checked style="width:auto"> Include relationship names and labels</label></div>
 </div><div class="public-note" style="margin-top:15px">Only publish information you're comfortable making public. Avoid private details, real contact information, or anything that identifies you or someone else.</div>
 <div class="form-actions"><button type="button" class="btn" id="cancelPublic">Cancel</button><button class="btn primary">Generate public page</button></div></form>`);
 $('#cancelPublic').onclick=()=>showCharacter(id);
 $('#publicForm').onsubmit=e=>{
  e.preventDefault();const chosen=new FormData(e.target),sections=[];
  const fields=[['appearance','Appearance'],['personality','Personality'],['backstory','Backstory'],['motivations','Motivations & fears'],['habits','Likes, dislikes & habits'],['notes','Notes & quotes']];
  fields.forEach(([key,label])=>{if(chosen.has(key)&&c[key])sections.push(`<section><h2>${label}</h2><p>${esc(c[key]).replace(/\n/g,'<br>')}</p></section>`);});
  let rel='';
  if(chosen.has('relationships')){
   const items=(c.relationships||[]).filter(r=>r&&typeof r==='object'&&r.targetId).map(r=>{const t=data.characters.find(x=>x.id===r.targetId);return t?`<li>${esc(t.name)} — ${esc(r.label||'connected')}</li>`:''}).filter(Boolean);
   if(items.length)rel=`<section><h2>Relationships</h2><ul>${items.join('')}</ul></section>`;
  }
  const pageHtml=`<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(c.name)} — Character profile</title><style>body{margin:0;background:#f5f3ed;color:#292c27;font:16px Arial,sans-serif;line-height:1.7}.wrap{max-width:760px;margin:7vh auto;padding:28px}.kicker{color:#78866b;text-transform:uppercase;letter-spacing:2px;font-size:11px}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:42px;margin:8px 0}h2{font-size:23px;border-bottom:1px solid #e5e2d8;padding-bottom:8px}section,.intro{background:#fffefa;border:1px solid #e5e2d8;border-radius:16px;padding:22px;margin:16px 0}.sub{color:#777b70}.avatar{max-width:180px;max-height:180px;object-fit:cover;border-radius:14px;margin:10px 0}</style><main class="wrap"><div class="kicker">Character archive</div><div class="intro">${c.image?`<img class="avatar" src="${esc(c.image)}" alt="">`:''}<h1>${esc(c.name)}</h1><div class="sub">${esc([c.nickname,c.age,c.role,c.universe].filter(Boolean).join(' · '))}</div></div>${sections.join('')}${rel}<p class="sub">Shared from Character Cabinet</p></main></html>`;
  const blob=new Blob([pageHtml],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${(c.name||'character').replace(/[^a-z0-9-_]/gi,'-').toLowerCase()}-public-page.html`;a.click();URL.revokeObjectURL(url);
  closeModal();alert('Public page created. Review it before sharing or uploading it anywhere.');
 };
}
window.openForm=openForm;
window.editItem=(key,id)=>{const item=data[key].find(x=>x.id===id);openForm(key==='stories'?'story':'universe',item);};
window.deleteItem=(key,id)=>{if(confirm('Delete this entry?')){data[key]=data[key].filter(x=>x.id!==id);save();render();}};
function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='character-cabinet-backup.json';a.click();URL.revokeObjectURL(url);
}
function createPublicPage(c){
 const fields=[
  ['nickname','Nickname'],['age','Age'],['role','Role in story'],['universe','Universe'],
  ['appearance','Appearance'],['personality','Personality'],['backstory','Backstory'],
  ['motivations','Motivations & fears'],['habits','Likes, dislikes & habits'],['notes','Notes & quotes']
 ];
 const chosen=fields.filter(([key])=>c[key]);
 const publicHtml=(selected)=>{
  const content=selected.map(([key,label])=>`<section><h2>${label}</h2><p>${esc(c[key]).replace(/\n/g,'<br>')}</p></section>`).join('');
  const photo=c.image?`<img class="portrait" src="${esc(c.image)}" alt="Portrait of ${esc(c.name)}">`:'';
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(c.name)} · Character profile</title><style>
  *{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#292c27;font:16px Arial,sans-serif;line-height:1.65}
  main{max-width:760px;margin:55px auto;padding:0 22px}.sheet{background:#fffefa;border:1px solid #e5e2d8;border-radius:22px;padding:clamp(24px,6vw,52px);box-shadow:0 10px 35px #292c2710}
  .eyebrow{text-transform:uppercase;letter-spacing:2px;color:#78866b;font-size:11px}.portrait{width:112px;height:112px;object-fit:cover;border-radius:18px;margin:20px 0}
  h1{font:normal clamp(34px,7vw,52px) Georgia,serif;line-height:1.1;margin:10px 0}h2{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#78866b;margin:28px 0 6px}
  p{white-space:normal;margin:0;color:#55594f}.footer{color:#898b81;font-size:12px;text-align:center;margin:18px}
  </style></head><body><main><article class="sheet"><div class="eyebrow">Character profile</div>${photo}<h1>${esc(c.name)}</h1>${content}</article><div class="footer">Shared from Character Cabinet</div></main></body></html>`;
 };
 openModal('Create a public character page',`
 <p class="muted">Choose what appears on the page. Only the selected details will be included in the exported HTML file. Anyone who receives the file or its published link may be able to view it.</p>
 <div class="field" style="margin:15px 0"><label><input type="checkbox" id="publicName" checked disabled style="width:auto;margin-right:8px">Character name (always included)</label></div>
 <div class="form-grid">${chosen.map(([key,label])=>`<label class="field"><span><input type="checkbox" class="public-field" value="${key}" checked style="width:auto;margin-right:8px">${label}</span></label>`).join('')}</div>
 <div class="form-actions"><button class="btn" id="cancelPublic">Cancel</button><button class="btn primary" id="downloadPublic">Download public page</button></div>`);
 $('#cancelPublic').onclick=closeModal;
 $('#downloadPublic').onclick=()=>{
  const selected=chosen.filter(([key])=>document.querySelector(`.public-field[value="${key}"]`)?.checked);
  const htmlPage=publicHtml(selected);
  const blob=new Blob([htmlPage],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`${c.name.trim().replace(/[^a-z0-9]+/gi,'-').toLowerCase()||'character'}-public-page.html`;a.click();URL.revokeObjectURL(url);
  closeModal();
  alert('Public page downloaded. To share it as a web link, publish this HTML file using a hosting service. This does not upload it automatically.');
 };
}
function importData(file){
 const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!imported.characters||!imported.universes||!imported.stories)throw Error();if(confirm('Import this archive? It will replace the data currently saved in this browser.')){data=imported;save();applySettings();setPage(page);alert('Archive imported.');}}catch(e){alert('That file does not look like a Character Cabinet backup.');}};reader.readAsText(file);
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
$('#addBtn').onclick=()=>openForm('character');
$('#closeModal').onclick=closeModal;
$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal();};
$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
applySettings();setPage('home');
</script>
